<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Be The Driver</title>
<style>
html{color-scheme:dark}
/* Fonts bundled with the game (SIL Open Font License, see src/fonts/LICENSE-*.txt).. */
@font-face{font-family:'VT323';font-style:normal;font-weight:400;font-display:swap;src:url(src/fonts/vt323-latin-400-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'VT323';font-style:normal;font-weight:400;font-display:swap;src:url(src/fonts/vt323-latin-ext-400-normal.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'VT323';font-style:normal;font-weight:400;font-display:swap;src:url(src/fonts/vt323-vietnamese-400-normal.woff2) format('woff2');
  unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url(src/fonts/press-start-2p-latin-400-normal.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Layout concept: an arcade cabinet screen. One column on phones; on wide screens the HUD sits left and the actions right.
   Everything is square-cornered, built from 4px pixel frames, with a fixed 8-colour palette. */
:root{
  --bg:#0d0a1f;--bg2:#15102e;--panel:#1d1740;--panel2:#2a2160;--ink:#000;--edge:#4b3fa0;
  --tx:#f3efff;--dim:#9a90d6;
  --gr:#52ff7a;--gr-d:#1f9a3d;--gold:#ffd43b;--gold-d:#b8860b;--red:#ff4d5e;--red-d:#9c1f2c;
  --cy:#38d9ff;--cy-d:#1b7f9c;--or:#ff9d2e;--or-d:#a85a00;--pu:#b983ff;--pu-d:#5b2fa8;
  --f-px:'Press Start 2P','VT323',monospace;--f-tx:'VT323','Courier New',monospace;
  --frame:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge),inset 4px 4px 0 rgba(255,255,255,.07),inset -4px -4px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font-family:var(--f-tx);font-size:22px;line-height:1.15;color:var(--tx);display:flex;justify-content:center;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(255,255,255,.025) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.025) 2px,transparent 2px);
  background-size:16px 16px;image-rendering:pixelated}
body{background-image:radial-gradient(ellipse 70% 45% at 50% -8%,rgba(125,72,255,.28),transparent 70%),linear-gradient(rgba(255,255,255,.025) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.025) 2px,transparent 2px);background-size:auto,16px 16px,16px 16px;background-attachment:fixed,scroll,scroll}
body::before{content:'';position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0;opacity:.32;
  background:var(--sky-far) repeat-x left bottom/auto 150px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:500;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px)}
#root{position:relative;z-index:1;width:100%;max-width:480px;min-height:100vh;overflow-x:hidden;padding-inline:12px;padding-bottom:84px}
img{image-rendering:pixelated}
.px-ic{display:inline-block;vertical-align:-3px;flex:none}
.lbl{color:var(--dim)}
.cur{font-family:var(--f-tx);font-size:18px;margin-left:4px}
.f{font-family:var(--f-tx)}

/* ---------- frames, buttons, bars ---------- */
.pxf{position:relative;background:var(--panel);box-shadow:var(--frame)}
.pxf2{position:relative;background:var(--panel2);box-shadow:var(--frame)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  font-family:var(--f-tx);font-size:22px;line-height:1;padding:12px 14px;text-align:center;color:#000;
  background:var(--c,var(--gr));
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),
    inset -4px -4px 0 0 var(--cd,var(--gr-d)),inset 4px 4px 0 0 rgba(255,255,255,.4)}
.btn:hover{filter:brightness(1.08)}
.btn .px-ic{filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000)}
.btn:active{transform:translateY(3px);
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),
    inset 4px 4px 0 0 var(--cd,var(--gr-d)),inset -4px -4px 0 0 rgba(255,255,255,.25)}
.btn:disabled{filter:grayscale(1) brightness(.55);pointer-events:none}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,.hud-av:focus-visible{outline:3px dashed var(--gold);outline-offset:6px}
.b-gr{--c:var(--gr);--cd:var(--gr-d)}
.b-gold{--c:var(--gold);--cd:var(--gold-d)}
.b-red{--c:var(--red);--cd:var(--red-d);color:#fff}
.b-cy{--c:var(--cy);--cd:var(--cy-d)}
.b-or{--c:var(--or);--cd:var(--or-d)}
.b-pu{--c:var(--pu);--cd:var(--pu-d);color:#fff}
.b-dim{--c:#3a3180;--cd:#241d58;color:var(--tx)}
.btn.blk{display:flex;width:100%}
.btn.sm{font-size:20px;padding:10px 8px}

.bar{position:relative;height:20px;background:#07050f;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);margin:4px}
.bar>i{display:block;height:100%;transition:width .4s steps(8);background:var(--gr);
  box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.3)}
.bar::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 3px),#07050f calc(10% - 3px),#07050f 10%)}
.bar.thin{height:12px}
.bar .gr{background:var(--gr)}.bar .or{background:var(--or)}.bar .red{background:var(--red)}.bar .gold{background:var(--gold)}.bar .cy{background:var(--cy)}

/* ---------- start screen ---------- */
.start{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:20px;padding-block:20px;max-width:420px;margin-inline:auto}
.st-l,.st-r{display:flex;flex-direction:column;gap:inherit}
.scene{position:relative;height:190px;overflow:hidden;background:linear-gradient(#1a1250 0 28%,#2b1a6b 28% 52%,#4a2488 52% 72%,#7a2f93 72% 100%);
  box-shadow:var(--frame)}
.sky-far,.sky-near{position:absolute;left:0;right:0;bottom:34px;height:96px;background-repeat:repeat-x;background-size:auto 96px;background-position:bottom left}
.sky-far{background-image:var(--sky-far);opacity:.9;animation:scrollx 40s linear infinite}
.sky-near{background-image:var(--sky-near);height:72px;background-size:auto 72px;animation:scrollx 14s linear infinite}
.road{position:absolute;left:0;right:0;bottom:0;height:34px;background:#0a0814;border-top:4px solid #3a3180}
.road::after{content:'';position:absolute;left:0;right:0;top:13px;height:4px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 24px,transparent 24px 48px);animation:scrollx 1.1s linear infinite}
.scene .bike{position:absolute;left:50%;bottom:20px;width:150px;margin-left:-75px;animation:bob .5s steps(2) infinite;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.6))}
.scene .cargo{position:absolute;left:50%;bottom:78px;margin-left:12px;animation:bob .5s steps(2) infinite}
@keyframes scrollx{to{background-position-x:480px}}   /* scenery flows left to right */
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.logo{text-align:center;padding-block:4px}
.logo h1{font-family:var(--f-px);font-weight:400;font-size:30px;line-height:1.35;color:var(--gold);
  text-shadow:4px 4px 0 var(--red-d),8px 8px 0 #000;letter-spacing:2px}
.tagline{margin-top:18px;font-size:22px;color:var(--cy)}
.hi{text-align:center;color:var(--gr);font-size:22px}
.start-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sstat{padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.sstat .v{font-family:var(--f-px);font-size:16px}
.sstat .l{font-size:17px;color:var(--dim);line-height:1}
.bills-hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;color:var(--dim);user-select:none}
.bills-hdr:hover,.bills-hdr.open{color:var(--tx)}
#bills-detail{padding:4px 14px 12px}
.bill-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:2px dotted #3a3180;color:var(--dim)}
.bill-row:last-child{border:0;color:var(--tx);padding-top:8px}
.start-actions{display:flex;flex-direction:column;gap:16px}
.start-main{font-size:26px;padding:18px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:12px;position:sticky;top:12px;z-index:20}
.hud-av{border:0;background:var(--panel2);padding:4px;cursor:pointer;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);flex:none;line-height:0}
.hud-av:active{transform:translateY(2px)}
.hud-who{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.hud-name{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold)}
.hud-stars{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.hud-stars .px-ic{flex:none}
.hud-stars b{font-family:var(--f-px);font-weight:400;font-size:10px;margin-left:6px;color:var(--tx)}
.tags{display:flex;gap:10px;flex:none}
.tag{font-family:var(--f-tx);font-size:22px;line-height:1;padding:6px 8px;display:flex;align-items:center;justify-content:center;min-width:48px;background:#07050f;color:var(--tx);box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge)}
.tag.gr{color:var(--gr)}

.game-body{display:flex;flex-direction:column;gap:20px;padding-block:20px 32px}
.pc-col{display:contents}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{padding:12px}
.stat .l{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:20px;margin-bottom:8px}
.stat .v{font-family:var(--f-tx);font-size:28px;line-height:1;white-space:nowrap}
.stat .v.gr{color:var(--gr)}.stat .v.gold{color:var(--gold)}.stat .v.red{color:var(--red)}
.stat .sub{font-size:16px;color:var(--dim);margin-top:4px}
.stat.warn{animation:warn 1s steps(2) infinite}
@keyframes warn{50%{box-shadow:0 -4px 0 0 var(--red),0 4px 0 0 var(--red),-4px 0 0 0 var(--red),4px 0 0 0 var(--red)}}
.meter{padding:12px}
.meter-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;color:var(--dim);font-size:20px}
.meter-top span:first-child{display:flex;align-items:center;gap:6px}
.meter-top b{font-family:var(--f-px);font-weight:400;font-size:11px;color:var(--tx)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;color:var(--dim)}
.strip span{display:flex;align-items:center;gap:6px;color:var(--tx)}
.rain-tag{color:var(--cy)!important}

.sec-t{display:flex;align-items:center;gap:8px;font-size:22px;color:var(--cy);padding-bottom:6px;margin-bottom:16px;border-bottom:4px dotted #3a3180}
.job-why{display:flex;gap:8px;align-items:flex-start;margin-top:16px;color:var(--or);line-height:1.1}
.job-why .px-ic{margin-top:2px}
.save-note{margin-top:14px;font-size:19px}
.util-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.util{flex-direction:column;gap:6px;min-height:84px;padding:10px 4px}
.util .lb{font-size:19px}
.util .sb{font-size:15px;opacity:.85}
.endday{margin-top:18px}
.save-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.log{display:flex;flex-direction:column;gap:10px}
.log-i{padding:6px 10px;border-left:6px solid #3a3180;color:var(--dim);font-size:20px}
.log-i.earn{border-color:var(--gr);color:var(--tx)}
.log-i.cost{border-color:var(--red);color:var(--red)}
.log-i.save{border-color:var(--gold);color:var(--gold)}
.log-i.info{border-color:var(--cy)}

/* ---------- animation screens ---------- */
.anim{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-block:24px;text-align:center;max-width:420px;margin-inline:auto}
.anim .scene{width:100%}
.anim-t{font-size:32px;color:var(--cy);line-height:1}
.review{width:100%;padding:14px;text-align:left;display:none}
.review.show{display:block;animation:pop .25s steps(3)}
.review.static{animation:none}
@keyframes rvglow{50%{outline-color:transparent;background:var(--bg2,#1a1f3a)}}
.review.static.rv-new{outline:4px solid var(--gold);outline-offset:4px;background:#3a2a00;animation:rvglow .6s steps(2) infinite}
em,i{font-style:normal}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.review .who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:var(--dim)}
.review .txt{font-size:22px;line-height:1.2;color:var(--tx)}
.tank{position:relative;width:64px;height:130px;background:#07050f;overflow:hidden;box-shadow:0 -4px 0 0 var(--or),0 4px 0 0 var(--or),-4px 0 0 0 var(--or),4px 0 0 0 var(--or)}
.tank::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 10px,#07050f 10px,#07050f 13px)}
.refuel-txt{font-size:24px;color:var(--or)}
.sleep-wrap{position:relative;width:120px;height:110px;display:flex;align-items:center;justify-content:center}
.zzz{position:absolute;font-family:var(--f-px);color:var(--cy);opacity:0;animation:zzz 1.8s steps(6) infinite}
.z1{font-size:12px;animation-delay:0s}.z2{font-size:16px;animation-delay:.6s}.z3{font-size:22px;animation-delay:1.2s}
@keyframes zzz{0%{opacity:0;transform:translate(24px,0)}30%{opacity:1}100%{opacity:0;transform:translate(56px,-60px)}}
.sleep-bar{width:100%;max-width:300px}
.sleep-top{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--dim)}

/* ---------- refuel modal ---------- */
.rf-overlay{position:fixed;inset:0;background:rgba(5,3,14,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.rf-box{width:min(380px,100%);padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:16px}
.rf-title{font-size:30px;color:var(--or)}
.rf-gauge{display:flex;align-items:center;gap:10px;color:var(--dim)}
.rf-gauge .bar{flex:1}
.rf-gauge .bar>i{position:absolute;top:0;left:0;transition:none}
.rf-gauge .lbl-v{font-family:var(--f-px);font-size:10px;min-width:64px;color:var(--tx)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:#07050f;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
input[type=range]::-moz-range-track{height:12px;background:#07050f;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:28px;margin-top:-8px;background:var(--or);border:0;border-radius:0;box-shadow:0 0 0 4px #000,inset -4px -4px 0 var(--or-d),inset 4px 4px 0 rgba(255,255,255,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:28px;background:var(--or);border:0;border-radius:0;box-shadow:0 0 0 4px #000,inset -4px -4px 0 var(--or-d),inset 4px 4px 0 rgba(255,255,255,.4)}
.rf-cost{display:flex;justify-content:space-between;gap:8px;color:var(--dim)}
.rf-cost b{color:var(--or);font-weight:400}
.rf-warn{color:var(--red)}
.rf-btns{display:flex;gap:16px;justify-content:center}

/* ---------- shop ---------- */
.shop{min-height:100vh;padding-block:20px 32px;display:flex;flex-direction:column;gap:20px}
.shop-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shop-title{font-size:30px;color:var(--pu);text-shadow:3px 3px 0 #000;flex:1;text-align:center}
.bike-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.bike-card img{width:100%;max-height:170px;object-fit:contain}
.bike-hp{display:flex;justify-content:space-between;align-items:center}
.bike-hp b{font-family:var(--f-px);font-weight:400;font-size:12px}
.bike-warn{color:var(--red);text-align:center}
.upg-list{display:flex;flex-direction:column;gap:16px}
.upg-cat{font-size:20px;color:var(--dim);padding-top:8px;border-bottom:4px dotted #3a3180;padding-bottom:4px}
.upg-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px}
.upg-ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#07050f;flex:none}
.upg-det{flex:1;min-width:0}
.upg-n{font-size:22px;color:var(--tx);margin-bottom:4px}
.upg-d{font-size:18px;color:var(--dim);line-height:1.1}
.owned{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--gr);padding:10px 4px;box-shadow:0 -3px 0 0 var(--gr),0 3px 0 0 var(--gr),-3px 0 0 0 var(--gr),3px 0 0 0 var(--gr)}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,3,14,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{max-width:400px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 16px}
.m-title{display:flex;align-items:center;gap:10px;font-size:30px;line-height:1;margin-bottom:12px}
.m-body{color:var(--dim);line-height:1.2;margin-bottom:14px}
.m-eff{padding:10px;background:#07050f;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.eff{display:flex;align-items:center;gap:8px;line-height:1.2}
.eff.gr{color:var(--gr)}.eff.red{color:var(--red)}.eff.or{color:var(--or)}.eff.cy{color:var(--cy)}
.day-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.day-row{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;background:#07050f}
.day-div{height:4px;background:#3a3180}
.interest{padding:10px;text-align:center;color:var(--gold);margin-bottom:16px;box-shadow:0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold)}
.interest small{display:block;color:var(--dim);margin-top:6px;font-size:19px}
.month-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:2px dotted #3a3180;color:var(--dim)}
.month-row:last-child{border:0}
.m-h{margin:12px 0 4px}

/* ---------- end ---------- */
.end{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-block:24px;text-align:center;max-width:400px;margin-inline:auto}
.end h1{font-weight:400;line-height:1.1;text-shadow:4px 4px 0 #000}

@keyframes rainfall{to{background-position:-12px 44px}}
.btn.offer.delivering{--c:#1d1740;--cd:#120d2e;color:var(--tx);cursor:default;pointer-events:none;
  box-shadow:0 -4px 0 0 var(--cy),0 4px 0 0 var(--cy),-4px 0 0 0 var(--cy),4px 0 0 0 var(--cy),inset 0 0 0 4px #000,0 0 22px rgba(56,217,255,.35)}
.offer.delivering .nm{color:var(--cy)}
.offer.delivering .er{color:var(--gold)}
.offer.delivering .co span{font-family:var(--f-px);font-size:15px;color:var(--gr)}
.dl-track{position:relative;display:block;width:100%;height:30px;margin-top:8px;background:#0a0814;border-top:3px solid #3a3180;border-bottom:3px solid #3a3180}
.dl-track::before{content:'';position:absolute;left:0;right:26px;top:12px;height:4px;background:repeating-linear-gradient(90deg,#5a4fb0 0 10px,transparent 10px 20px)}
.dl-bar{position:absolute;left:0;top:0;bottom:0;display:block;background:linear-gradient(90deg,transparent,rgba(255,212,59,.45));box-shadow:inset 0 -3px 0 var(--gold);transition:width .1s linear;max-width:calc(100% - 26px)}
.dl-bike{position:absolute;right:-18px;bottom:0;height:30px;width:auto;transform:scaleX(-1);animation:bob .4s steps(2) infinite;filter:drop-shadow(2px 2px 0 #000)}
.dl-flag{position:absolute;right:2px;top:2px;line-height:0;animation:bob 1s steps(2) infinite}
.offer:disabled{filter:grayscale(.5) brightness(.62)}
.of-ic{align-items:center;justify-content:center;padding:6px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 3px rgba(0,0,0,.4)}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.pips i{display:block;width:8px;height:8px;background:rgba(0,0,0,.35)}.pips i.on{background:#000}
.tg{box-shadow:0 2px 0 rgba(0,0,0,.5)}
.offer.rush:not(:disabled):not(.delivering){animation:rushpulse 1.2s steps(2) infinite}
@keyframes rushpulse{50%{outline-color:#ffb3bb}}
.offer.combo:not(:disabled)::after{content:'';position:absolute;right:6px;top:-8px;width:8px;height:8px;background:var(--pu);box-shadow:-12px 0 0 var(--pu),-24px 0 0 var(--pu-d)}
.btn.offer{position:relative}
.bar>i{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 6px,transparent 6px 12px)}
.sec-t{text-shadow:2px 2px 0 #000}
.stat .v{text-shadow:2px 2px 0 rgba(0,0,0,.6)}
@media(max-width:859px){.hscene{height:112px}.hscene .bike{width:84px;margin-left:-42px;bottom:10px}.hscene .cargo{bottom:46px}.hscene .cargo .px-ic{width:24px;height:24px}}
@media(prefers-reduced-motion:reduce){.sstars,.logo h1,.rain,.hscene.go .sky-far,.hscene.go .sky-near{animation:none}}

/* ---------- blackjack ---------- */
.modal.bj{max-width:460px}
.bj-table{background:#0f5a34;background-image:radial-gradient(ellipse at 50% 40%,#1a7a47,#0b4427);box-shadow:inset 0 0 0 4px #062a17,inset 0 0 0 8px #8a5a1a;padding:18px 14px;margin:12px 0;display:flex;flex-direction:column;gap:14px;min-height:150px}
.bj-row{display:flex;flex-direction:column;gap:6px;padding:4px}
.bj-row.act{outline:3px dashed var(--gold);outline-offset:2px}
.bj-who{font-size:19px;color:#cfeedd}.bj-who b{color:var(--gold)}.bj-who b.gr{color:var(--gr)}.bj-who b.red{color:#ff8b95}.bj-who b.gold{color:var(--gold)}

.bj-card{position:relative;width:46px;height:64px;background:#f5f1e6;color:#111;box-shadow:0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000,inset -3px -3px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 5px;animation:pop .2s steps(3)}

.bj-su{display:block}
.bj-card.back{background:repeating-linear-gradient(45deg,#3a2aa0 0 6px,#6b57e0 6px 12px);box-shadow:0 -3px 0 #000,0 3px 0 #000,-3px 0 0 #000,3px 0 0 #000,inset 0 0 0 4px #f5f1e6}
.bj-empty{color:#cfeedd;text-align:center;padding:30px 8px;line-height:1.2}
.bj-res{text-align:center;font-size:26px;margin-bottom:8px}.bj-res.gr{color:var(--gr)}.bj-res.red{color:var(--red)}.bj-res.gold{color:var(--gold)}

.bj-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}

<div id="root"></div>

<button id="snd-btn" onclick="openSettings()" hidden></button>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
const BUILD='ba224c95c9';   // content hash filled in by build.py; shown in the sound settings so a stale cached copy is easy to spot
// ===== GAME CLOCK: one loop drives every timer in the game =====
// All game timing (day clock, deliveries, animations, delays) runs on this clock, so pausing is a single switch:
// while GT.paused the clock does not advance and nothing scheduled with every()/after() fires.
// Only real UI niceties (toast, AI request timeout) still use the browser timers.
const GT={t:0,last:0,paused:false,tasks:[],id:null};
function gnow(){return GT.t}                 // game time in ms (excludes paused time)
function loopTick(){
  const n=Date.now(),dt=Math.min(250,n-GT.last);GT.last=n;   // a long freeze (hidden tab) never turns into a burst of catch-up
  if(GT.paused)return;
  GT.t+=dt;
  for(const k of GT.tasks.slice()){
    if(k.dead||GT.t<k.at)continue;
    if(k.every){k.at+=k.every;if(k.at<GT.t)k.at=GT.t}else k.dead=true;
    try{k.fn()}catch(e){console.error(e)}
  }
  if(GT.tasks.some(k=>k.dead))GT.tasks=GT.tasks.filter(k=>!k.dead);
}
function loopStart(){if(!GT.id){GT.last=Date.now();GT.id=setInterval(loopTick,25)}}
function every(ms,fn){const k={at:GT.t+ms,every:ms,fn,dead:false};GT.tasks.push(k);loopStart();return k}
function after(ms,fn){const k={at:GT.t+ms,fn,dead:false};GT.tasks.push(k);loopStart();return k}
function stopT(k){if(k)k.dead=true}
function stopAllT(){GT.tasks.forEach(k=>k.dead=true);GT.tasks=[]}
function setPaused(p){
  GT.paused=!!p;GT.last=Date.now();
  document.body.classList.toggle('paused',!!p);
  document.querySelectorAll('svg').forEach(s=>{try{p?s.pauseAnimations():s.unpauseAnimations()}catch(e){}});
}

function ic(name,size){
  const d=ICONS[name];if(!d)return'';size=size||24;
  const rows=d.m;let r='';
  for(let y=0;y<rows.length;y++){
    let x=0;const row=rows[y];
    while(x<row.length){
      const ch=row[x];
      if(ch==='.'){x++;continue}
      let w=1;while(x+w<row.length&&row[x+w]===ch)w++;
      r+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${d.p[ch]}"/>`;
      x+=w;
    }
  }
  return`<svg class="px-ic" width="${size}" height="${size}" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
function starsHTML(avg,size){
  const n=Math.round(avg);let h='';
  for(let i=1;i<=5;i++)h+=ic(i<=n?'star':'starOff',size||16);
  return`<span class="stars" role="img" aria-label="${avg.toFixed(1)} trên 5 sao">${h}</span>`;
}
function starsFixed(n,size){
  let h='';for(let i=1;i<=5;i++)h+=ic(i<=n?'star':'starOff',size||16);
  return`<span class="stars" role="img" aria-label="${n} trên 5 sao">${h}</span>`;
}

// 12x12 driver portrait. h/H helmet, s skin, e eyes, m mouth, j/J jacket, o outline
const AV_MAP=['...oooooo...','..ohhhhhho..','.ohhhhhhhho.','.ohhhhhhhho.','.oHhhhhhhHo.','.osssssssso.','.osesssesso.','.osssssssso.','..ossmmsso..','..ojjjjjjo..','.ojjjjjjjjo.','.ojJjjjjJjo.'];
const HELMETS=['#ff4d5e','#ffd43b','#38d9ff','#52ff7a','#b983ff','#ff9d2e','#f3efff'];
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))));
  return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function avatarHTML(helmet,size){
  const hc=helmet||HELMETS[0];
  const pal={o:'#000',h:hc,H:shade(hc,.65),s:'#f2c28f',e:'#000',m:'#b5503c',j:'#1fae4c',J:'#14762f'};
  let r='';
  AV_MAP.forEach((row,y)=>{
    let x=0;
    while(x<row.length){
      const ch=row[x];if(ch==='.'){x++;continue}
      let w=1;while(x+w<row.length&&row[x+w]===ch)w++;
      r+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${pal[ch]}"/>`;x+=w;
    }
  });
  return`<svg class="px-ic" width="${size||40}" height="${size||40}" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

// Tiling city skyline as an SVG data URI (seeded so it looks the same every load)
function skylineURI(seed,body,win,h){
  let s=seed;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  const W=480;let x=0,r='';
  while(x<W){
    const bw=Math.min(W-x,24+Math.floor(rnd()*5)*8);
    const bh=24+Math.floor(rnd()*((h-24)/8))*8;
    r+=`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="${body}"/>`;
    for(let wy=h-bh+8;wy<h-8;wy+=16)for(let wx=x+8;wx<x+bw-8;wx+=16)
      if(rnd()>.45)r+=`<rect x="${wx}" y="${wy}" width="4" height="8" fill="${win}"/>`;
    x+=bw;
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${h}" shape-rendering="crispEdges">${r}</svg>`;
  return'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}
(function(){
  const rs=document.documentElement.style;
  rs.setProperty('--sky-far',skylineURI(7,'#231659','#4a3a9a',96));
  rs.setProperty('--sky-near',skylineURI(21,'#120b36','#ffd43b',72));
})();


// ===== AUDIO: background music on the start screen + a settings dialog =====
const START_SRC="src/music.mp3";
const TRACKS=[
  {n:'Waiting Time',src:"src/track1.mp3"},
  {n:'8-Bit Retro',src:"src/track2.mp3"},
  {n:'Game 8-Bit On',src:"src/track3.mp3"},
  {n:'I Love My 8-Bit Game Console',src:"src/track4.mp3"},
];
const AUD={on:true,vol:.5,track:0,el:null,key:null,fade:null};
try{const a=JSON.parse(localStorage.getItem('btd_audio')||'null');if(a){AUD.on=a.on!==false;AUD.vol=Math.min(1,Math.max(0,Number.isFinite(a.vol)?a.vol:.5));AUD.track=Number.isInteger(a.track)&&a.track>=0&&a.track<TRACKS.length?a.track:0}}catch(e){}
function audSave(){try{localStorage.setItem('btd_audio',JSON.stringify({on:AUD.on,vol:AUD.vol,track:AUD.track}))}catch(e){}}
// What should be playing for the current screen: one fixed loop on the start screen, the playlist during a run, nothing after it ends.
function musicTarget(){
  if(!AUD.on||document.visibilityState==='hidden')return null;
  const p=g.phase;
  if(p==='start')return{key:'start',src:START_SRC,loop:true};
  if(p==='win'||p==='lose')return null;
  return{key:'t'+AUD.track,src:TRACKS[AUD.track].src,loop:false};
}
function fadeOut(){
  const a=AUD.el;if(!a||AUD.fade)return;
  AUD.fade=setInterval(()=>{
    a.volume=Math.max(0,a.volume-.1);
    if(a.volume<=.01){clearInterval(AUD.fade);AUD.fade=null;a.pause();AUD.el=null;AUD.key=null;musicSync()}
  },50);
}
// Idempotent: make the audio element match the screen. Browsers block sound until the first tap, so a refused play() is retried on the next gesture.
function musicSync(){
  const t=musicTarget();
  if(AUD.fade){if(t&&t.key===AUD.key){clearInterval(AUD.fade);AUD.fade=null;AUD.el.volume=AUD.vol}else return}
  if(!t){
    if(AUD.el&&!AUD.el.paused){if(document.visibilityState==='hidden')AUD.el.pause();else fadeOut()}
    return;
  }
  if(AUD.el&&AUD.key!==t.key){if(!AUD.el.paused){fadeOut();return}AUD.el=null;AUD.key=null}
  if(!AUD.el){const a=new Audio(t.src);a.loop=t.loop;a.preload='auto';a.onended=musicEnded;AUD.el=a;AUD.key=t.key}
  AUD.el.volume=AUD.vol;
  if(AUD.el.paused){const p=AUD.el.play();if(p&&p.catch)p.catch(()=>{})}
}
function musicEnded(){if(AUD.key&&AUD.key[0]==='t')skipTrack(1)}   // playlist: the next song starts by itself, and it wraps around
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(musicTarget()&&(!AUD.el||AUD.el.paused))musicSync()},{passive:true}));
document.addEventListener('visibilitychange',musicSync);

function openSettings(){if(modal&&modal.type!=='settings'&&modal.type!=='pause')return;const fp=modal&&modal.type==='pause';modal={type:'settings',from:fp?'pause':null};render()}
function closeSettings(){if(modal&&modal.type==='settings'){modal=modal.from==='pause'?{type:'pause'}:null;render()}}

function skipTrack(d){

function hobbyList(){
  const p=g.profile;const l=p.hobbies.map(id=>(HOBBIES.find(h=>h.id===id)||{}).t).filter(Boolean);
  if(p.hobbyText.trim())l.push(p.hobbyText.trim());return l;

function normalizeState(){
  if(!g.profile)g.profile=defProfile();
  g.profile=Object.assign(defProfile(),g.profile);

}
function calcStars(){
  const last=g.reviews.slice(0,20);
  const sum=last.reduce((s,r)=>s+r.stars,0);
  return(25+sum)/(5+last.length);   // five invisible 5-star ratings keep one bad order from wrecking the score
}
function rollRating(ok){
  const r=Math.random();
  if(ok===2)return r<.85?5:4;
  if(ok===1)return r<.2?2:r<.6?3:4;
  return r<.5?1:2;
}
function templateReview(stars,job){
  const food=job.id==='food';
  const pool=TPL[stars].slice();
  const hl=g.profile.hobbies.map(id=>HOBBY_LINE[id]).filter(Boolean);
  if(stars>=4&&hl.length&&Math.random()<.45)return hl[rnd(0,hl.length-1)];
  const t=pool[rnd(0,pool.length-1)];
  return t.replace(/\{name\}/g,g.profile.name.trim()?'Tài xế '+pname():'Tài xế').replace(/\{J\}/g,food?'Đồ ăn':'Hàng').replace(/\{j\}/g,food?'đồ ăn':'hàng');
}

let _sample,_aiBusyUntil=0,_aiInflight=false;
async function getSample(){
  if(_sample!==undefined)return _sample;
  try{_sample=(window.claude&&typeof window.claude.use==='function'&&await window.claude.use('sample'))||null}catch(e){_sample=null}
  return _sample;
}
function aiPrompt(r,ctx){
  const ds=['giao rất trễ, hàng bị hỏng hoặc thiếu','giao hơi trễ','giao nhanh, hàng nguyên vẹn'][ctx.ok];
  const hb=hobbyList();
  return`Bạn là một khách hàng Việt Nam vừa nhận ${ctx.job.id==='food'?'đơn đồ ăn':'đơn hàng'} từ tài xế Be${g.profile.name.trim()?` tên ${pname()}`:''}${hb.length?` (sở thích của tài xế: ${hb.join(', ')})`:''}.
Tình hình lần giao này: ${ds}${g.rainToday?', trời đang mưa':''}${g.vehicleHp<40?', xe của tài xế trông đã cũ hỏng':''}.
Bạn đã chấm ${r.stars}/5 sao.
Viết đúng một câu đánh giá bằng tiếng Việt, tối đa 110 ký tự, giọng tự nhiên như người thật, hợp với số sao đã chấm. Có thể nhắc nhẹ đến sở thích của tài xế nếu hợp. Không emoji, không ngoặc kép. Chỉ trả về câu đánh giá.`;
}
async function askClaudeReview(r,ctx,onDone){
  if(_aiInflight||Date.now()<_aiBusyUntil)return;
  const sample=await getSample();if(!sample)return;
  _aiInflight=true;
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);
  try{
    const out=await sample(aiPrompt(r,ctx),{signal:ac.signal,modelTier:'quick',cache:false});
    let t=(out&&out.text||'').trim().split('\n')[0].replace(/^["“”']+|["“”']+$/g,'').trim();
    if(t&&t.length<=160){r.text=t;r.ai=true;save();onDone&&onDone(r)}
  }catch(e){
    const code=e&&e.code;
    if(code==='not_granted'){_aiBusyUntil=Infinity;toast('KHÔNG BẬT ĐƯỢC ĐÁNH GIÁ MỚI — DÙNG ĐÁNH GIÁ CÓ SẴN','warn')}
    else if(code==='rate_limited')_aiBusyUntil=Date.now()+60000;
  }finally{clearTimeout(to);_aiInflight=false}
}
function addReview(ok,job){
  if(!g.profile.reviewsOn)return null;
  const stars=rollRating(ok);
  const r={stars,text:templateReview(stars,job),who:CUSTOMERS[rnd(0,CUSTOMERS.length-1)],job:job.id,day:g.day,month:g.month,ai:false};
  g.reviews.unshift(r);if(g.reviews.length>40)g.reviews.pop();
  g.stars=calcStars();
  askClaudeReview(r,{ok,job},rv=>{
    const el=document.getElementById('rv');if(el&&el.dataset.id===String(r.t0))el.innerHTML=reviewHTML(rv);
  });
  r.t0=Date.now()+Math.random();
  return r;
}

// ===== HELPERS =====
function fm(n){
  if(!n&&n!==0)return'—';
  const a=Math.abs(Math.round(n));
  const s=n<0?'-':'';
  if(a>=1e6)return s+(a/1e6%1?((a/1e6).toFixed(1)):(a/1e6))+'TR';
  if(a>=1e3)return s+Math.round(a/1e3)+'K';
  return s+a.toLocaleString('vi-VN');
}
function ff(n){return(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('vi-VN')+' đ'}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function addLog(m,t='info'){g.log.unshift({m,t});if(g.log.length>20)g.log.pop()}
function up(id){return !!(g.upgrades&&g.upgrades[id])}
// GPS halves jams and cancellations; rush hour doubles jams; a worn bike breaks down more; riding fast raises accident/fine odds.
function evtChance(e){
  let p=e.p;
  if((e.id==='jam'||e.id==='cnl')&&up('gps'))p*=.5;
  if(e.id==='jam'&&isPeak())p*=2;
  if(e.id==='brk')p*=1+(100-g.vehicleHp)/50;
  if(e.id==='brk'||e.id==='crs'||e.id==='fin')p*=DRIVE[g.drive].risk;
  return p;
}
function rollEvt(){let r=Math.random(),c=0;for(const e of EVTS){c+=evtChance(e);if(r<c)return e;}return null}
// a failed delivery (no pay) cannot earn a customer tip, VIP bonus or reward: only bad events can still happen
function rollEvtFor(earn){const e=rollEvt();return(e&&earn<=0&&e.t==='good')?null:e}

let _saveWarned=false;
// Only write states that are consistent: never mid-delivery/refuel (money moves at the end), never while a
// day/month summary is pending (interest is already applied but not yet confirmed), never after the game ended.
function canPersist(){
  if(!g||!g.phase)return false;
  if(['start','win','lose','anim-refuel'].includes(g.phase))return false;
  if(modal&&(modal.type==='dayEnd'||modal.type==='monthEnd'))return false;   // life modals are saved with their pending choice discarded by restore()
  return true;
}
function save(){
  if(!canPersist())return;
  const fixed=repairState(g);if(fixed.length)console.warn('[btd] repaired state fields:',fixed.join(', '));   // never write a broken state
  try{localStorage.setItem('btd_v2',JSON.stringify(g));}
  catch(e){if(!_saveWarned){_saveWarned=true;toast('KHÔNG LƯU ĐƯỢC TIẾN TRÌNH TRÊN TRÌNH DUYỆT NÀY','warn');}}
}
function load(){try{const s=localStorage.getItem('btd_v2');return s?JSON.parse(s):null;}catch(e){return null}}
function saneSave(s){
  return !!s&&typeof s==='object'&&['cash','savings','month','day','stamina','fuel','vehicleHp'].every(k=>Number.isFinite(s[k]));
}
// A save can be taken in the shop, the profile screen or mid-sleep; any of those resumes on the main screen.
function hasSave(){const s=load();return saneSave(s)&&!['start','win','lose'].includes(s.phase)}
function restore(s){
  const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,Number.isFinite(v)?v:lo));
  g=s;normalizeState();
  g.upgrades=g.upgrades&&typeof g.upgrades==='object'?g.upgrades:{};
  g.log=Array.isArray(g.log)?g.log:[];
  g.stamina=clamp(g.stamina,0,100);g.fuel=clamp(g.fuel,0,fuelMax());g.vehicleHp=clamp(g.vehicleHp,0,100);
  g.month=clamp(g.month,1,C.maxMonths);g.day=clamp(g.day,1,C.daysPerMonth);
  g.dayTimeLeft=clamp(g.dayTimeLeft,1,C.dayDuration);
  g.cash=Math.round(g.cash);g.savings=Math.max(0,Math.round(g.savings));
  ['dailyEarned','dailySpent','earned','delivered','totalDelivered'].forEach(k=>{g[k]=Number.isFinite(g[k])?g[k]:0});
  g.rainToday=!!g.rainToday;
  const od=g.upgrades,nu={};   // older saves: map retired upgrades onto the new ones
  Object.keys(od).forEach(k=>{const u=UPGS.find(x=>x.id===k);if(u&&!u.rep&&od[k])nu[k]=true});
  if(od.engine)nu.turbo=true;if(od.heatbag)nu.heat=true;
  if(od.tires)g.cash+=15e5;if(od.tank)g.cash+=2e6;
  g.upgrades=nu;
  g.drive=[0,1,2].includes(g.drive)?g.drive:1;
  if(!Array.isArray(g.ms))g.ms=MS.filter(m=>g.savings>=m.at).map(m=>m.at);
  lifeFix(g);
  g.fin=Object.assign({earn:0,fuel:0,repair:0,accident:0,bills:0,upg:0,life:0},g.fin&&typeof g.fin==='object'?g.fin:{});
  if(!Array.isArray(g.offers)||!g.offers.length||!g.offers.every(o=>o&&C.jobs[o.type]&&DIST[o.dist]&&Number.isFinite(o.base)))g.offers=genOffers();
  clearTmrs();modal=null;DLV=null;g.activeAnim=null;g.phase='game';
}
function earnMult(){return g.vehicleHp>=70?1:g.vehicleHp>=50?.85:g.vehicleHp>=30?.7:.55}
// ===== ORDERS =====
function hourOf(){return 6+16*(1-g.dayTimeLeft/C.dayDuration)}   // a game day runs 06:00-22:00
function isPeak(){const h=hourOf();return(h>=11&&h<13)||(h>=17&&h<19)}
function dayPart(){const h=hourOf();return h<8?'dawn':h<17?'day':h<19.5?'dusk':'night'}
// sun / moon travel along an arc over the day; returns inline position for #hscene .sun
function sunPos(){const p=Math.min(1,Math.max(0,(hourOf()-6)/16)),y=62-Math.sin(p*Math.PI)*46;return`left:${(6+p*80).toFixed(1)}%;top:${y.toFixed(0)}px`}
function sceneSync(){
  const sc=document.getElementById('hscene');if(!sc)return;
  sc.dataset.t=dayPart();const s=sc.querySelector('.sun');if(s)s.style.cssText=sunPos();
}
function fmH(){const h=hourOf(),H=Math.floor(h),M=Math.floor((h-H)*6)*10;return(H<10?'0':'')+H+':'+(M<10?'0':'')+M}
function genOffer(peak){
  const type=Math.random()<.5?'food':'goods',job=C.jobs[type];
  const r=Math.random(),dist=r<.35?0:r<.75?1:2,combo=Math.random()<C.comboChance;
  const rush=Math.random()<(peak?.35:.2)+(up('prio')?.1:0);
  const base=rnd(job.min,job.max)*DIST[dist].earn*(rush?1.7:1)*(peak?1.25:1)*(combo?C.comboPay:1)*C.payScale;
  return{type,dist,rush,combo,peak:!!peak,base:Math.round(base/1000)*1000};
}
function genOffers(){const n=up('prio')?4:3,p=isPeak(),r=[];for(let i=0;i<n;i++)r.push(genOffer(p));return r}
function offerCost(o){
  const job=C.jobs[o.type],d=DIST[o.dist];
  const cb=o.combo?C.comboCost:1,sta=job.sta*d.sta*cb*(up('turbo')?.8:1);
  const fuel=job.fuel*d.fuel*cb*DRIVE[g.drive].fuel*(up('eco')?.65:up('turbo')?1.25:1);
  return{sta:Math.max(4,Math.round(sta)),fuel:Math.max(1,Math.round(fuel))};
}
function offerTime(o){return Math.max(3,Math.round(DIST[o.dist].t*DRIVE[g.drive].t*(o.rush?.8:1)*(o.combo?C.comboTime:1)*(up('eco')?1.3:up('turbo')?.75:1)))}   // delivery seconds
function offerPay(o){
  let e=o.base;
  if(g.rainToday)e*=.6;
  if(up('heat'))e*=o.type==='food'?1.25:.9;
  if(up('crate'))e*=o.type==='goods'?1.2:.9;
  if(up('vip'))e*=1.15;
  return Math.floor(e*earnMult());
}
function canDoOffer(o){const c=offerCost(o);return !isSick()&&g.stamina>=c.sta&&g.fuel>=c.fuel&&g.vehicleHp>0}
function offerWhy(o){
  const c=offerCost(o);
  if(isSick())return`đang ốm, còn nghỉ ${g.sickDays} ngày`;
  if(g.vehicleHp<=0)return'xe hỏng, cần sửa ở mục Nâng cấp';
  const lack=[];
  if(g.fuel<c.fuel)lack.push(`xăng (cần ${c.fuel}%, còn ${g.fuel}%)`);
  if(g.stamina<c.sta)lack.push(`thể lực (cần ${c.sta}, còn ${g.stamina})`);
  return lack.length?'thiếu '+lack.join(' và '):'';
}
function refreshOffers(){
  if(modal||g.activeAnim||g.phase!=='game')return;
  if(g.dayTimeLeft<=10){toast('KHÔNG ĐỦ THỜI GIAN ĐỂ ĐỔI ĐƠN','warn');return}
  g.dayTimeLeft-=8;g.offers=genOffers();save();render();
}
function setDrive(i){
  if(modal||g.activeAnim||g.phase!=='game'||![0,1,2].includes(i))return;
  g.drive=i;save();render();
}
// Write the state with this order's costs already paid, so a reload mid-delivery cannot refund them.
function persistNow(patch){try{localStorage.setItem('btd_v2',JSON.stringify(Object.assign({},g,{phase:'game',activeAnim:null},patch||{})))}catch(e){}}
function fuelMax(){return 100}

// ===== DAY TIMER =====
function startDayTimer(){
  stopT(dayTmr);
  dayTmr=every(1000,()=>{if(!modal)dayStep()});   // popups (refuel, day/month end, tutorial) freeze the day; deliveries and sleeping use it up
}
function dayStep(){
  const busy=!!DLV||g.phase==='anim-refuel';
  if(g.dayTimeLeft>0)g.dayTimeLeft--;
  const el=document.getElementById('day-tmr');
  if(el)el.textContent=fmT(g.dayTimeLeft);
  const ck=document.getElementById('clk');
  if(ck){const pk=isPeak();ck.textContent=fmH();ck.classList.toggle('peak',pk)}
  if(g.dayTimeLeft%5===0)sceneSync();
  if(g.dayTimeLeft>0&&g.dayTimeLeft%10===0)save();   // keeps the clock when the tab is closed mid-day
  if(g.dayTimeLeft<=0&&!busy){stopT(dayTmr);triggerDayEnd();return false}   // a delivery in progress finishes first
  return true;
}
function fmT(s){const m=Math.floor(s/60);const sc=s%60;return`${m}:${sc<10?'0':''}${sc}`}

const HOLD_MS=1500;   // how long a finished refuel / sleep screen stays before returning to the game
// ===== ACTIONS =====
function startGame(fresh){
  if(!fresh){const s=load();if(saneSave(s)&&!['start','win','lose'].includes(s.phase)){restore(s);lifeResume();startDayTimer();render();toast('GAME CŨ ĐÃ TẢI!');return;}}
  if(fresh){const old=load(),keep=(old&&old.profile)||g.profile;init();g.profile=Object.assign(defProfile(),keep);}   // every stat back to its starting value, driver profile kept
  g.phase='game';addLog('Bắt đầu hành trình!','info');
  startDayTimer();save();render();   // save now so a reload cannot bring the old game back
}

function doDelivery(i){
  if(modal||g.activeAnim||g.phase!=='game')return;
  const o=g.offers[i];if(!o)return;
  const c=offerCost(o);
  if(!canDoOffer(o)){toast(g.vehicleHp<=0?'XE HỎNG QUÁ NẶNG!':g.fuel<c.fuel?'HẾT XĂNG!':'HẾT THỂ LỰC!','bad');return;}
  g.stamina=Math.max(0,g.stamina-c.sta);
  g.fuel=Math.max(0,g.fuel-c.fuel);
  const earn=offerPay(o);
  g.offers[i]=genOffer(isPeak());
  persistNow();
  startDelivery(i,o,earn);
}

function doRefuel(){
  if(modal||g.activeAnim||g.phase!=='game')return;
  if(g.fuel>=fuelMax()-2){toast('BÌNH ĐÃ GẦN ĐẦY!');return;}
  modal={type:'refuel',target:g.fuel};   // shared modal state: the day clock pauses while it is open
  render();
}
function rfInfo(){
  const t=modal.target,fill=Math.max(0,t-g.fuel);
  const cost=fill*Math.round(C.fuelCost/fuelMax());
  return{t,fill,cost,ok:g.cash>=cost};
}
function rfSlide(v){
  if(!modal||modal.type!=='refuel')return;
  modal.target=parseInt(v)||g.fuel;
  const i=rfInfo(),$=id=>document.getElementById(id);
  if($('rf-fill'))$('rf-fill').style.width=(i.t/fuelMax()*100)+'%';
  if($('rf-lbl'))$('rf-lbl').textContent=i.t+'/'+fuelMax()+'%';
  if($('rf-add'))$('rf-add').textContent=i.fill+'%';
  if($('rf-cost'))$('rf-cost').textContent=ff(i.cost);
  if($('rf-warn'))$('rf-warn').hidden=i.ok||i.fill===0;
  if($('rf-go'))$('rf-go').disabled=!i.ok||i.fill===0;
}
function rfConfirm(){
  if(!modal||modal.type!=='refuel')return;
  const i=rfInfo();
  if(i.fill<=0)return;
  if(!i.ok){toast('KHÔNG ĐỦ TIỀN!','bad');return;}
  const startFuel=g.fuel,val=i.t,fillable=i.fill,cost=i.cost;
  modal=null;
  g.cash-=cost;g.dailySpent+=cost;g.fin.fuel+=cost;
  persistNow({fuel:val});
  g.activeAnim={type:'refuel',timeLeft:3,total:3,targetFuel:val,startFuel,costPaid:cost};
  g.phase='anim-refuel';
  render();
  refuelVisual(startFuel,val,3000);
  animTmr=every(1000,()=>{
    g.activeAnim.timeLeft--;
    const tEl=document.getElementById('fuel-txt');
    if(tEl)tEl.textContent=g.activeAnim.timeLeft>0?g.activeAnim.timeLeft+'s còn lại':'Hoàn tất!';
    if(g.activeAnim.timeLeft<=0){
      stopT(animTmr);
      g.fuel=val;
      const f=document.getElementById('fuel-fill'),p=document.getElementById('fuel-pct');   // make sure the gauge really shows the finished tank
      if(f)f.style.width=val+'%';if(p)p.textContent=val+'%';
      addLog('Đổ xăng +'+fillable+'%: -'+ff(cost),'cost');
      after(HOLD_MS,()=>{if(g.phase!=='anim-refuel')return;g.activeAnim=null;g.phase='game';save();render();});   // let the full tank sit on screen for a moment
    }
  });
}

// Cosmetic only: the gauge fills with a CSS transition and the percentage counts up smoothly; the real fuel is set when the timer ends.
function refuelVisual(a,b,ms){
  const t0=gnow();
  (function step(){
    if(g.phase!=='anim-refuel')return;
    const k=Math.min(1,Math.max(0,(gnow()-t0)/ms)),v=a+(b-a)*k;
    const el=document.getElementById('fuel-pct'),f=document.getElementById('fuel-fill');
    if(el)el.textContent=Math.round(v)+'%';
    if(f)f.style.width=v+'%';
    if(k<1)requestAnimationFrame(step);
  })();
}

function doSleep(){
  if(modal||g.activeAnim||g.phase!=='game')return;
  if(g.stamina>=100){toast('THỂ LỰC ĐÃ ĐẦY!');return;}
  g.activeAnim={type:'sleep'};g.phase='anim-sleep';render();
  animTmr=every(1000,()=>{
    g.stamina=Math.min(100,g.stamina+C.sleepRate);
    const bar=document.getElementById('sleep-bar');
    const txt=document.getElementById('sleep-txt');
    if(bar)bar.style.width=g.stamina+'%';
    if(txt)txt.textContent=g.stamina+'/100';
    if(g.stamina>=100){
      stopT(animTmr);
      addLog('Nghỉ ngơi đủ giấc ('+g.stamina+'/100)','info');
      const sb=document.querySelector('.anim .btn');if(sb)sb.disabled=true;
      after(HOLD_MS,()=>{if(g.phase!=='anim-sleep')return;g.activeAnim=null;g.phase='game';save();render();});
    }
  });
}
function stopSleep(){
  stopT(animTmr);
  addLog('Dừng nghỉ — thể lực: '+g.stamina+'/100','info');
  g.activeAnim=null;g.phase='game';
  save();render();
}
function askEndDay(){
  if(modal||g.activeAnim||g.phase!=='game')return;
  if(g.dayTimeLeft>90){modal={type:'confirmEnd'};render();return}   // lots of the day left: ask first
  doEndDay();
}
function startClick(fresh){
  startGame(fresh);
  let seen=false;try{seen=!!localStorage.getItem('btd_tut')}catch(e){}
  if(!seen){if(g.phase==='game'&&!modal){modal={type:'tut',i:0};render()}}
}
function tutDone(){try{localStorage.setItem('btd_tut','1')}catch(e){}modal=null;render()}
function doEndDay(){
  if(modal||g.activeAnim||g.phase!=='game')return;
  stopT(dayTmr);
  triggerDayEnd();
}

function advanceDay(){
  if(g.day<C.daysPerMonth)g.day++;
  g.dayTimeLeft=C.dayDuration;g.offers=genOffers();
  lifeNewDay();lifeRoll();
  startDayTimer();render();
}

function doSave(a){
  if(g.phase!=='game'&&g.phase!=='anim-sleep')return;
  let amt=a==='all'?Math.max(0,g.cash-5e5):a;
  if(amt<=0||amt>g.cash){toast('KHÔNG ĐỦ TIỀN!','bad');return;}
  g.cash-=amt;g.savings+=amt;
  addLog('Gửi tiết kiệm: +'+ff(amt),'save');
  if(netWin()){finish(true);return;}
  const ms=checkMilestones();if(ms.length)modal={type:'milestone',list:ms};
  save();render();
}

function checkMilestones(){
  const hit=[];
  MS.forEach(m=>{if(g.savings>=m.at&&!g.ms.includes(m.at)){g.ms.push(m.at);g.cash+=m.reward;addLog('Mốc '+fm(m.at)+': thưởng '+ff(m.reward),'earn');hit.push(m)}});
  return hit;
}

function doWd(a){
  if(g.phase!=='game')return;
  let amt=a==='all'?g.savings:a;
  if(amt<=0||amt>g.savings){toast('KHÔNG ĐỦ SỐ DƯ!','bad');return;}
  g.savings-=amt;g.cash+=amt;
  addLog('Rút tiết kiệm: '+ff(amt),'info');
  save();render();
}

function goUpgrade(){if(g.phase==='game'){g.phase='upgrade';render();}}
function goGame(){if(g.phase==='upgrade'||g.phase==='profile'){g.phase='game';render();}}

function buyUpgrade(id){
  const u=UPGS.find(x=>x.id===id);
  if(!u)return;
  if(u.req&&!g.ms.includes(u.req)){toast('CHƯA MỞ KHÓA — CẦN '+fm(u.req)+' TIẾT KIỆM','warn');return;}
  if(g.upgrades[u.id]&&!u.rep){toast('BẠN ĐÃ CÓ NÂNG CẤP NÀY','warn');return;}
  if(u.rep&&g.vehicleHp>=100){toast('XE CÒN NGUYÊN VẸN, KHÔNG CẦN SỬA','warn');return;}
  if(g.cash<u.cost){toast('KHÔNG ĐỦ TIỀN!','bad');return;}
  g.cash-=u.cost;g.dailySpent+=u.cost;
  if(u.rep)g.fin.repair+=u.cost;else g.fin.upg+=u.cost;
  if(id==='fix_s'){g.vehicleHp=Math.min(100,g.vehicleHp+30);}
  else if(id==='fix_f'){g.vehicleHp=100;}
  else{
    const other=u.grp&&UPGS.find(x=>x.grp===u.grp&&x.id!==u.id&&g.upgrades[x.id]);
    if(other){delete g.upgrades[other.id];addLog(`Thay ${other.name} bằng ${u.name}`,'info');}
    g.upgrades[u.id]=true;
  }
  addLog(`Mua ${u.name}: -${ff(u.cost)}`,'cost');
  save();render();toast('ĐÃ MUA!');
}

// ===== DELIVERY (progress bar inside the order card; no mini-games) =====
// One order at a time. Costs are paid at the start (and persisted), the pay and any random event arrive at the end.
let DLV=null,RVNEW=null;   // DLV {i,o,earn,start,dur,ups}: module state only, never saved, so a reload cannot refund the order. RVNEW: review that just arrived (highlighted 3 s)
function dlvLeft(){return DLV?Math.max(0,DLV.dur-(gnow()-DLV.start)/1000):0}
function startDelivery(i,o,earn){
  DLV={i,o,earn,start:gnow(),dur:offerTime(o),ups:Object.assign({},g.upgrades)};   // upgrades bought mid-delivery only count from the next order
  g.activeAnim={type:'deliver'};
  render();
  dlvTmr=every(100,dlvTick);
}
function dlvTick(){
  if(!DLV)return;
  const left=dlvLeft(),p=Math.min(100,(1-left/DLV.dur)*100);
  const b=document.getElementById('dl-bar'),t=document.getElementById('dl-t');
  if(b)b.style.width=p+'%';
  if(t)t.textContent=Math.ceil(left)+'s';
  if(left<=0){if(modal)return;stopT(dlvTmr);completeDelivery()}   // wait while a popup (life hub, settings) is open
}
function completeDelivery(){
  const{o,earn}=DLV,job=C.jobs[o.type];
  const nowUps=g.upgrades;g.upgrades=DLV.ups;   // the order is settled with the upgrades it started with
  const evt=rollEvtFor(earn),res=evt?evt.fn(earn):null;
  if(res&&res.hp&&up('tire2'))res.hp=Math.round(res.hp*.6);
  const paid=res&&res.skip?0:earn;          // "khách hủy" means no income for this order
  const ok=(g.vehicleHp<30||(evt&&evt.t==='bad'))?1:2;
  RVNEW=(res&&res.skip)?null:addReview(ok,job);
  if(paid>0){g.cash+=paid;g.earned+=paid;g.dailyEarned+=paid;g.fin.earn+=paid;burst(26,FX_COIN)}
  g.delivered++;g.totalDelivered++;
  if(evt){
    if(res.hp){
      if(res.cash)res.cash=Math.round(res.cash*(g.upgrades.insure?.4:1));
      g.vehicleHp=Math.max(0,g.vehicleHp+res.hp);
    }
    if(res.rain)g.rainToday=true;
    if(res.sta)g.stamina=Math.max(0,g.stamina+res.sta);
    if(res.cash){g.cash+=res.cash;if(res.cash>0){g.dailyEarned+=res.cash;g.fin.earn+=res.cash}else{g.dailySpent+=Math.abs(res.cash);g.fin.accident+=Math.abs(res.cash)}}
    addLog(`${evt.ti}: ${res.msg}`,evt.t==='good'?'earn':evt.t==='bad'?'cost':'info');
    modal={type:'event',evt,res};
  }
  addLog(`${job.name}${o.combo?' ghép':''}: ${paid>0?'+'+ff(paid):'không có thu nhập'}`,paid>0?'earn':'cost');
  g.upgrades=nowUps;
  DLV=null;g.activeAnim=null;
  save();
  if(g.vehicleHp<=0)toast('XE HỎNG NẶNG! CẦN SỬA NGAY!','bad');
  render();
  if(RVNEW){const r=RVNEW;after(3000,()=>{if(RVNEW===r){RVNEW=null;const e=document.getElementById('rv-last');if(e)e.classList.remove('rv-new')}})}
}


// ===== DAY END =====
function finish(win){
  clearTmrs();modal=null;g.activeAnim=null;DLV=null;
  g.phase=win?'win':'lose';
  try{localStorage.removeItem('btd_v2');}catch(e){}
  render();
  if(win){burst(90,FX_WIN,{v:420});after(500,()=>burst(70,FX_WIN,{x:innerWidth*.25,y:innerHeight*.45}));after(900,()=>burst(70,FX_WIN,{x:innerWidth*.75,y:innerHeight*.45}))}
}

function triggerDayEnd(){
  if(g.phase==='anim-sleep'){stopT(animTmr);g.activeAnim=null;g.phase='game';addLog('Hết ngày khi đang nghỉ ngơi','info');}
  const interest=Math.floor(g.savings*C.dailyInterest);
  g.savings+=interest;
  if(netWin()){finish(true);return;}
  const inv=invDayEnd(),lot=lottoDraw();
  const ms=checkMilestones();
  modal={type:'dayEnd',earned:g.dailyEarned,spent:g.dailySpent,interest,day:g.day,ms,inv,lot};
  render();
}

function confirmDayEnd(){
  g.dailyEarned=0;g.dailySpent=0;g.wasRain=g.rainToday;g.rainToday=false;modal=null;
  if(g.day>=C.daysPerMonth){triggerMonthEnd();return;}
  advanceDay();save();
}

function monthBonus(del){
  let b=del>=480?35e5:del>=360?2e6:del>=240?1e6:0;
  if(del>=120)b+=g.stars>=4.5?1e6:g.stars>=4?5e5:0;   // good ratings pay extra
  return b;
}
function billsTotal(){return BILLS+UPGS.reduce((n,u)=>n+(u.fee&&g.upgrades[u.id]?u.fee:0),0)}
function triggerMonthEnd(){
  stopT(dayTmr);
  const bonus=monthBonus(g.delivered);
  modal={type:'monthEnd',month:g.month,earned:g.earned,bonus,del:g.delivered,stars:g.stars,bills:billsTotal()};
  render();
}

function confirmMonthEnd(){
  const {bonus}=modal;
  const bills=billsTotal();
  g.cash+=bonus;g.cash-=bills;g.fin.bills+=bills;
  familyMonthEnd();debtMonthEnd();
  if(bonus>0)addLog('Thưởng Be: +'+ff(bonus),'earn');
  addLog('Chi phí tháng '+g.month+': -'+ff(bills),'cost');
  if(g.cash<0&&g.savings>0){   // bills come out of savings before the player is declared broke
    const t=Math.min(g.savings,-g.cash);g.savings-=t;g.cash+=t;
    addLog('Rút tiết kiệm '+ff(t)+' để trả chi phí tháng','info');
  }
  if(g.cash<-2e6||g.endWhy==='debt'){finish(false);return;}
  g.month++;g.day=1;g.earned=0;g.delivered=0;
  g.dailyEarned=0;g.dailySpent=0;g.dayTimeLeft=C.dayDuration;
  modal=null;
  if(g.month>C.maxMonths){invLiquidate();const c=Math.min(g.debt,Math.max(0,g.cash));g.cash-=c;g.debt-=c;const t=Math.min(g.debt,g.savings);g.savings-=t;g.debt-=t;finish(netWin());return;}
  lifeNewDay();lifeRoll();
  save();startDayTimer();render();
}

// ===== PAUSE =====
// Everything runs on the game clock (loop.js), so pausing = freezing that clock. Screens that patch the DOM directly
// (delivery / refuel / sleep animations) get a light overlay instead of a modal, because a re-render would reset them.
let pausedLight=false;
function canPause(){
  if(!g||modal||GT.paused)return false;
  return ['game','anim-refuel','anim-sleep'].includes(g.phase);
}
function pauseGame(){
  if(!canPause())return;
  setPaused(true);
  if(g.phase==='game'){pausedLight=false;modal={type:'pause'};render();return}
  pausedLight=true;showLightPause();
}
function showLightPause(){
  const o=document.getElementById('pause-ov');
  if(o){o.innerHTML=`<div class="pxf2 modal"><div class="m-title" style="color:var(--gold)">${ic('pause',28)} TẠM DỪNG</div><div class="lbl" style="text-align:center">Thời gian đang dừng.</div><button class="btn b-gr blk" onclick="resumeGame()">TIẾP TỤC</button><button class="btn b-dim blk" style="margin-top:8px" onclick="askHome()">VỀ MÀN HÌNH BẮT ĐẦU</button></div>`;o.hidden=false}
  pauseBtnSync();
}
// Back to the start screen from the pause menu. The game stays saved (continue with TIẾP TỤC); an order in progress is cancelled.
function askHome(){
  const light=pausedLight;
  if(light){pausedLight=false;const o=document.getElementById('pause-ov');if(o){o.hidden=true;o.innerHTML=''}}
  else if(!modal||modal.type!=='pause')return;
  modal={type:'confirmHome',from:light?'light':'pause'};render();
}
function cancelHome(){
  if(!modal||modal.type!=='confirmHome')return;
  if(modal.from==='light'){modal=null;pausedLight=true;render();showLightPause()}
  else{modal={type:'pause'};render()}
}
function goHome(){
  if(!modal||modal.type!=='confirmHome')return;
  const ph=g.phase;
  modal=null;pausedLight=false;
  const o=document.getElementById('pause-ov');if(o){o.hidden=true;o.innerHTML=''}
  stopAllT();DLV=null;g.activeAnim=null;
  if(ph==='game'||ph==='anim-sleep')save();   // an unfinished delivery/refuel is not saved, like a reload
  setPaused(false);g.phase='start';render();pauseBtnSync();
}
function resumeGame(){
  if(pausedLight){
    pausedLight=false;const o=document.getElementById('pause-ov');if(o){o.hidden=true;o.innerHTML=''}
    setPaused(false);pauseBtnSync();return;
  }
  if(!modal||(modal.type!=='pause'&&!(modal.type==='settings'&&modal.from==='pause')))return;
  modal=null;setPaused(false);render();
}
function pauseBtnSync(){
  const b=document.getElementById('pause-btn');if(!b)return;
  b.hidden=!canPause();
  b.innerHTML=ic('pause',24);
}
document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){
    if(pausedLight||(modal&&modal.type==='pause'))resumeGame();
    else if(modal&&modal.type==='confirmHome')cancelHome();
    else if(modal&&modal.type==='settings'&&modal.from==='pause')closeSettings();
    else if(canPause())pauseGame();
  }
});

// ===== EFFECTS: pixel particles on a full-screen canvas (follows the game clock, so pausing freezes them) =====
const FX={ps:[],run:false,last:0};
function burst(n,colors,opt){
  const cv=document.getElementById('fx');if(!cv)return;
  opt=opt||{};
  cv.width=innerWidth;cv.height=innerHeight;
  const cx=opt.x!==undefined?opt.x:innerWidth/2,cy=opt.y!==undefined?opt.y:innerHeight*.38;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(opt.v||260)*(.35+Math.random()*.65);
    FX.ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(opt.up||160),life:0,max:900+Math.random()*700,s:4+(Math.random()*2|0)*2,c:colors[i%colors.length]});
  }
  if(!FX.run){FX.run=true;FX.last=gnow();requestAnimationFrame(fxStep)}
}
function fxStep(){
  const cv=document.getElementById('fx');if(!cv){FX.run=false;FX.ps=[];return}
  const T=gnow(),dt=Math.min(50,T-FX.last);FX.last=T;
  const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
  FX.ps=FX.ps.filter(p=>p.life<p.max);
  FX.ps.forEach(p=>{
    p.life+=dt;p.vy+=900*dt/1000;p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;
    x.globalAlpha=Math.max(0,1-p.life/p.max);x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  });
  x.globalAlpha=1;
  if(FX.ps.length)requestAnimationFrame(fxStep);else{FX.run=false;x.clearRect(0,0,cv.width,cv.height)}
}
const FX_COIN=['#ffd23f','#ffb000','#fff3a8'],FX_WIN=['#ffd23f','#ff4d5e','#3dff7a','#4dd2ff','#b36bff'];

// ===== STATE SHAPE AND RUNTIME CHECKS =====
/**
 * @typedef {Object} Offer
 * @property {'food'|'goods'} type
 * @property {0|1|2} dist         near / medium / far
 * @property {boolean} rush
 * @property {boolean} [combo]   multi-drop order
 * @property {boolean} peak
 * @property {number} base        pay in VND
 *
 * @typedef {Object} State        the one global `g` (saved as localStorage 'btd_v2')
 * @property {number} cash @property {number} savings
 * @property {number} month @property {number} day @property {number} dayTimeLeft
 * @property {number} stamina @property {number} fuel @property {number} vehicleHp   0-100
 * @property {number} stars       1-5
 * @property {number} dailyEarned @property {number} dailySpent @property {number} earned
 * @property {number} delivered @property {number} totalDelivered
 * @property {Object<string,boolean>} upgrades
 * @property {{m:string,t:string}[]} log
 * @property {'start'|'game'|'upgrade'|'profile'|'anim-refuel'|'anim-sleep'|'win'|'lose'} phase
 * @property {Offer[]} offers
 * @property {number[]} ms        reached savings milestones
 * @property {0|1|2} drive        slow / normal / fast
 */
const PHASES=['start','game','upgrade','profile','anim-refuel','anim-sleep','win','lose'];
const _inR=(v,lo,hi)=>Number.isFinite(v)&&v>=lo&&v<=hi;
function offerOk(o){return !!o&&!!C.jobs[o.type]&&!!DIST[o.dist]&&Number.isFinite(o.base)&&o.base>0}
// List what is wrong with a state object (empty array = valid). Pure: does not change anything.
function stateProblems(s){
  const p=[];
  if(!s||typeof s!=='object')return['not an object'];
  if(!Number.isFinite(s.cash))p.push('cash');
  if(!_inR(s.savings,0,1e12))p.push('savings');
  if(!_inR(s.month,1,C.maxMonths))p.push('month');
  if(!_inR(s.day,1,C.daysPerMonth))p.push('day');
  if(!_inR(s.dayTimeLeft,0,C.dayDuration))p.push('dayTimeLeft');
  ['stamina','fuel','vehicleHp'].forEach(k=>{if(!_inR(s[k],0,100))p.push(k)});
  if(!_inR(s.stars,1,5))p.push('stars');
  if(![0,1,2].includes(s.drive))p.push('drive');
  ['dailyEarned','dailySpent','earned','delivered','totalDelivered'].forEach(k=>{if(!_inR(s[k],0,1e13))p.push(k)});
  if(!PHASES.includes(s.phase))p.push('phase');
  if(!s.upgrades||typeof s.upgrades!=='object'||Array.isArray(s.upgrades))p.push('upgrades');
  if(!Array.isArray(s.log))p.push('log');
  if(!Array.isArray(s.ms))p.push('ms');
  if(!Array.isArray(s.offers)||!s.offers.length||!s.offers.every(offerOk))p.push('offers');
  if(!s.fin||typeof s.fin!=='object')p.push('fin');
  return p.concat(lifeBad(s));
}
// Fix a live state in place (clamp numbers, rebuild broken containers). Returns the list of repaired fields.
function repairState(s){
  const bad=stateProblems(s);if(!bad.length||!s||typeof s!=='object')return bad;
  const cl=(v,lo,hi,d)=>Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d;
  s.cash=cl(s.cash,-1e12,1e12,0);s.savings=cl(s.savings,0,1e12,0);
  s.month=cl(s.month,1,C.maxMonths,1);s.day=cl(s.day,1,C.daysPerMonth,1);s.dayTimeLeft=cl(s.dayTimeLeft,0,C.dayDuration,C.dayDuration);
  ['stamina','fuel','vehicleHp'].forEach(k=>s[k]=cl(s[k],0,100,100));
  s.stars=cl(s.stars,1,5,5);if(![0,1,2].includes(s.drive))s.drive=1;
  ['dailyEarned','dailySpent','earned','delivered','totalDelivered'].forEach(k=>s[k]=cl(s[k],0,1e13,0));
  if(!s.upgrades||typeof s.upgrades!=='object'||Array.isArray(s.upgrades))s.upgrades={};
  if(!Array.isArray(s.log))s.log=[];
  if(!Array.isArray(s.ms))s.ms=[];
  if(!s.fin||typeof s.fin!=='object')s.fin={earn:0,fuel:0,repair:0,accident:0,bills:0,upg:0};
  if(!Array.isArray(s.offers)||!s.offers.length||!s.offers.every(offerOk))s.offers=genOffers();
  lifeFix(s);
  return bad;
}

// ===== LIFE SIM: hidden difficulty, health/family/debt, choice events =====
// Difficulty is rolled at game start, never shown while playing, revealed on the win/lose screen.
const HARDS=[
  {n:'DỄ THỞ',m:.7,c:'var(--gr)'},
  {n:'BÌNH THƯỜNG',m:1,c:'var(--gold)'},
  {n:'KHẮC NGHIỆT',m:1.4,c:'var(--red)'},
];
function hardM(){return(HARDS[g.hard]||HARDS[1]).m}
function lifeDefaults(){return{hard:Math.floor(Math.random()*HARDS.length),health:100,family:60,debt:0,sickDays:0,lifeCd:0,lifeSeen:{},tickets:0,invCost:{},wasRain:false,pend:'',inv:{},drink:0,gamble:0,bjToday:0,bjLoss:0,bjNet:0,quitM:0,debtRate:0,endWhy:''}}
function lifeFix(s){   // fill / clamp life fields (older saves, repair)
  const d=lifeDefaults(),cl=(v,lo,hi,x)=>Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):x;
  s.hard=[0,1,2].includes(s.hard)?s.hard:1;
  s.health=cl(s.health,0,100,100);s.family=cl(s.family,0,100,60);s.debt=Math.round(cl(s.debt,0,1e12,0));
  s.sickDays=Math.round(cl(s.sickDays,0,30,0));s.lifeCd=Math.round(cl(s.lifeCd,0,60,0));
  if(!s.lifeSeen||typeof s.lifeSeen!=='object'||Array.isArray(s.lifeSeen))s.lifeSeen={};
  s.tickets=Math.round(cl(s.tickets,0,TICKET_MAX,0));
  if(!s.invCost||typeof s.invCost!=='object'||Array.isArray(s.invCost))s.invCost={};
  Object.keys(s.invCost).forEach(k=>{if(!Number.isFinite(s.invCost[k])||s.invCost[k]<0)s.invCost[k]=0});
  s.wasRain=!!s.wasRain;s.pend=typeof s.pend==='string'?s.pend:'';
  s.debtRate=cl(s.debtRate,0,1,0);if(!s.debt)s.debtRate=0;s.endWhy=typeof s.endWhy==='string'?s.endWhy:'';
  s.drink=cl(s.drink,0,100,0);s.gamble=cl(s.gamble,0,100,0);
  s.bjToday=Math.round(cl(s.bjToday,0,BJ_MAX,0));s.bjLoss=Math.round(cl(s.bjLoss,0,99,0));s.bjNet=Math.round(cl(s.bjNet,-1e12,1e12,0));s.quitM=Math.round(cl(s.quitM,0,99,0));
  if(!s.inv||typeof s.inv!=='object'||Array.isArray(s.inv))s.inv={};
  Object.keys(s.inv).forEach(k=>{if(!Number.isFinite(s.inv[k])||s.inv[k]<0)s.inv[k]=0});
  return s;
}
function lifeBad(s){
  const p=[];
  if(![0,1,2].includes(s.hard))p.push('hard');
  ['health','family'].forEach(k=>{if(!_inR(s[k],0,100))p.push(k)});
  if(!_inR(s.debt,0,1e12))p.push('debt');
  if(!_inR(s.sickDays,0,30))p.push('sickDays');
  if(!_inR(s.lifeCd,0,60))p.push('lifeCd');
  if(!s.lifeSeen||typeof s.lifeSeen!=='object'||Array.isArray(s.lifeSeen))p.push('lifeSeen');
  if(!_inR(s.debtRate,0,1))p.push('debtRate');
  if(!_inR(s.tickets,0,TICKET_MAX))p.push('tickets');
  if(!s.invCost||typeof s.invCost!=='object'||Array.isArray(s.invCost)||Object.values(s.invCost).some(v=>!_inR(v,0,1e12)))p.push('invCost');
  ['drink','gamble'].forEach(k=>{if(!_inR(s[k],0,100))p.push(k)});
  if(!_inR(s.bjToday,0,BJ_MAX))p.push('bjToday');if(!_inR(s.bjLoss,0,99))p.push('bjLoss');if(!_inR(s.bjNet,-1e12,1e12))p.push('bjNet');
  if(!s.inv||typeof s.inv!=='object'||Array.isArray(s.inv)||Object.values(s.inv).some(v=>!_inR(v,0,1e12)))p.push('inv');
  return p;
}

function chapterNote(){
  const n=[];
  if(g.debt>0)n.push(`Bạn đang nợ ${ff(g.debt)}.`);
  if(g.health<40)n.push('Sức khỏe bạn đang yếu.');
  if(g.family<30)n.push('Gia đình đang rất lo cho bạn.');
  else if(g.family>=70)n.push('Mẹ luôn yên tâm về bạn.');
  if(g.drink>=40||g.gamble>=40)n.push('Có những thói quen bạn biết là cần bớt.');
  if(g.savings>=C.winTarget*.5)n.push('Tiết kiệm đã được một nửa chặng đường.');
  return n.join(' ');
}
function bizBet(amt,p){
  lifeSpend(amt);
  if(Math.random()<p){const back=Math.round(amt*1.7);g.cash+=back;g.fin.life=Math.max(0,(g.fin.life||0)-back);return `Quán đông khách, chia lời đều đặn: bạn nhận lại ${ff(back)}.`}
  return 'Quán vắng khách rồi đóng cửa sau vài tháng. Số vốn góp coi như mất. Bạn bè xin lỗi rối rít.';
}
// Ending text for the win/lose screen: depends on how the player lived, not only on the money.
function endingInfo(win){
  if(win){
    if(g.drink>=50||g.gamble>=50)return{t:'ĐẾN ĐÍCH, NHƯNG THÓI QUEN CÒN BÁM',l:'Bạn đã có đủ tiền, nhưng những thói quen cũ vẫn theo bạn về quê.'};
    if(g.health<40)return{t:'ĐẾN ĐÍCH TRONG KIỆT SỨC',l:'Bạn đạt mục tiêu, cơ thể thì đã trả giá đắt. Giờ là lúc nghỉ ngơi.'};
    if(g.family<30)return{t:'GIÀU HƠN, XA NHÀ HƠN',l:'Số tiền có rồi, nhưng quê nhà đã xa hơn bạn tưởng. Hãy gọi về cho mẹ.'};
    if(g.family>=70&&g.health>=70)return{t:'VỀ QUÊ VẸN TOÀN',l:'Bạn về quê với tiền tiết kiệm, sức khỏe tốt và nụ cười của mẹ ở cổng nhà.'};
    return{t:'HOÀN THÀNH MỤC TIÊU',l:'Hai năm vất vả đã đổi lấy một khoản tiết kiệm xứng đáng.'};
  }
  if(g.endWhy==='debt')return{t:'NỢ NẦN SIẾT CỔ',l:'Lãi mẹ đẻ lãi con, chủ nợ đến tận cửa. Lần sau, hãy tránh xa vay nóng.'};
  if(g.month<=C.maxMonths)return{t:'HẾT VỐN NƠI PHỐ',l:'Bạn hết tiền trước khi kịp đứng vững. Bài học: giữ lại một khoản dự phòng.'};
  const r=g.savings/C.winTarget;
  if(r>=.7)return{t:'THIẾU MỘT CHÚT',l:'Bạn chỉ còn cách đích một đoạn ngắn. Phố vẫn còn đó, thử lại nhé.'};
  if(g.family<30)return{t:'LẠC NHỊP',l:'Bạn tiết kiệm được ít và cũng xa gia đình. Có lẽ đã đến lúc về nhà.'};
  return{t:'CHƯA ĐỦ SỨC',l:'Hai năm trôi qua nhanh hơn bạn nghĩ. Hãy thử cách khác: ít chi tiêu lặt vặt, nhiều đơn hợp lý.'};
}
function borrow(amt,rate){
  g.cash+=amt;g.debt+=amt;g.debtRate=Math.max(g.debtRate,rate);addLog('Vay '+ff(amt)+(rate?` (lãi ${Math.round(rate*100)}%/tháng)`:' (không lãi)'),'warn');
}
function repay(amt){
  amt=Math.min(amt,g.debt,Math.max(0,g.cash));if(amt<=0)return;
  g.cash-=amt;g.debt-=amt;if(g.debt<=0){g.debt=0;g.debtRate=0}addLog('Trả nợ '+ff(amt),'save');
  if(g.phase==='game'&&netWin()){modal=null;finish(true)}
}
// Lottery: expected return a little under the ticket price, rare big prizes (drawn per ticket).
const TICKET=2e4,TICKET_MAX=40;
// Tickets are bought during the day and drawn at the end of the day (see lottoDraw, called from triggerDayEnd).
function lottoBuy(n){
  n=Math.min(n,TICKET_MAX-g.tickets);if(n<=0)return 'Hôm nay bạn đã mua đủ số vé tối đa rồi.';
  if(g.cash<n*TICKET)return 'Không đủ tiền mua vé.';
  lifeSpend(n*TICKET);g.tickets+=n;if(n>=10)g.gamble=Math.min(100,g.gamble+2);
  return `Bạn cất ${n} tờ vé vào túi. Tối nay sẽ có kết quả xổ số.`;
}
function lottoDraw(){
  const n=g.tickets;let prize=0,best=0;
  for(let i=0;i<n;i++){const r=Math.random();const p=r<.0005?1e7:r<.0085?1e6:r<.0685?1e5:0;prize+=p;best=Math.max(best,p)}
  g.tickets=0;
  if(prize){g.cash+=prize;g.fin.life=Math.max(0,(g.fin.life||0)-prize)}
  return{n,prize,best,cost:n*TICKET};
}
// Gambling: a first small win ("beginner's luck") hooks, afterwards the house wins more often. Hard mode tilts it further.
function gamble(stake,hook){
  const first=!g.lifeSeen.won;g.gamble=Math.min(100,g.gamble+hook);
  const pWin=first?1:Math.max(.25,.42-g.gamble/400-(g.hard===2?.04:0));
  if(Math.random()<pWin){const w=Math.round(stake*1.8);g.cash+=w-stake;g.lifeSeen.won=1;return first?`Bạn thắng ${ff(w-stake)}! Tim đập thình thịch... và muốn chơi thêm.`:`Lần này bạn thắng ${ff(w-stake)}.`}
  lifeSpend(stake);return `Thua sạch ${ff(stake)}. Bạn thấy cay, nhưng cũng thấy mình dại.`;
}
function lifeNewDay(){
  if(g.sickDays>0){g.sickDays--;lifeGain('health',2);if(!g.sickDays)addLog('Đã khỏe lại, có thể chạy xe!','good');else addLog(`Còn ốm ${g.sickDays} ngày.`,'warn')}
  else lifeGain('health',3);
  if(g.lifeCd>0)g.lifeCd--;
  g.bjToday=0;g.bjLoss=0;
  if(Math.random()<.5)g.drink=Math.max(0,g.drink-1);if(Math.random()<.5)g.gamble=Math.max(0,g.gamble-1);
}
// Roll at most one life event for the new day; returns true if a modal was opened.
function lifeRoll(){
  if(modal)return false;
  if(g.day===1){
    const sid=STORY[g.month],k='s'+g.month;
    if(sid&&!g.lifeSeen[k]){g.pend=sid;modal={type:'life',id:sid,res:null};return true}
    if(CHAPTERS[g.month]&&!g.lifeSeen['c'+g.month]){modal={type:'chapter',n:g.month};return true}
  }
  if(g.lifeCd>0)return false;
  const order=LIFE_EVTS.map(e=>[Math.random(),e]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  for(const e of order){
    if(e.when()&&Math.random()<e.p()){
      g.lifeCd=3;g.lifeSeen[e.id]=(g.lifeSeen[e.id]||0)+1;
      g.pend=e.id;modal={type:'life',id:e.id,res:null};return true;
    }
  }
  return false;
}
// a reload while an event is open brings the same event back (no dodging a bad event by refreshing)
function lifeResume(){if(g.pend&&LIFE_EVTS.some(e=>e.id===g.pend))modal={type:'life',id:g.pend,res:null};else g.pend=''}
function lifeEvt(){return modal&&modal.type==='life'?LIFE_EVTS.find(e=>e.id===modal.id):null}
function lifeChoose(i){
  const e=lifeEvt();if(!e||modal.res!==null)return;
  const c=e.choices[i];if(!c||(c.ok&&!c.ok()))return;
  g.pend='';if(STORY[g.month]===e.id)g.lifeSeen['s'+g.month]=1;
  modal.res=c.fn();addLog(e.ti+': '+modal.res.split('.')[0],'info');save();render();
}
function lifeClose(){modal=null;render()}

// ===== PHASE 2: family remittance + investments (hub modal) =====
// Investments are held as VND value per asset; each month the value moves by a random return. They are sold into savings
// automatically when the 24 months end. Savings interest (0.2%/day) stays the safe baseline.
const INVS=[
  {id:'gold',n:'VÀNG',ic:'gold',mu:.05,sd:.08,d:'Biến động vừa, hay tăng khi kinh tế xấu.'},
  {id:'stock',n:'CHỨNG KHOÁN',ic:'chart',mu:.08,sd:.25,d:'Có thể lãi lớn hoặc mất nhiều. Chơi bằng tiền nhàn rỗi.'},
];
const INV_FEE=.01;
function invOf(id){return(g.inv&&g.inv[id])||0}
function invTotal(){return INVS.reduce((n,x)=>n+invOf(x.id),0)}
function gauss(){let u=0;for(let i=0;i<6;i++)u+=Math.random();return(u-3)/.707}   // ~N(0,1)
// Prices move every day; returns one row per held asset for the end-of-day summary (change %, VND change, value, profit vs cost).
function invDayEnd(){
  const rows=[];
  INVS.forEach(x=>{
    const v=invOf(x.id);if(v<=0)return;
    const r=Math.max(-.25,x.mu/30+x.sd/Math.sqrt(30)*gauss()*(g.hard===2?1.15:1)),nv=Math.round(v*(1+r));
    g.inv[x.id]=nv;rows.push({id:x.id,n:x.n,ic:x.ic,pct:r*100,delta:nv-v,val:nv,pl:nv-(g.invCost[x.id]||0)});
  });
  return rows;
}
function invBuy(id,amt){
  if(g.phase!=='game'||!(amt>0)||amt>g.cash){toast('KHÔNG ĐỦ TIỀN!','bad');return}
  g.cash-=amt;g.inv[id]=invOf(id)+amt;g.invCost[id]=(g.invCost[id]||0)+amt;addLog(`Mua ${INVS.find(x=>x.id===id).n}: ${ff(amt)}`,'save');save();render();
}
function invSell(id,amt){
  const v=invOf(id);if(g.phase!=='game'||v<=0)return;
  amt=amt==='all'?v:Math.min(amt,v);const fee=Math.round(amt*INV_FEE);
  g.invCost[id]=Math.round((g.invCost[id]||0)*(v-amt)/v);g.inv[id]=v-amt;g.cash+=amt-fee;g.fin.life=(g.fin.life||0)+fee;
  addLog(`Bán ${INVS.find(x=>x.id===id).n}: +${ff(amt-fee)} (phí ${ff(fee)})`,'earn');save();render();
}
function remit(amt){
  if(g.phase!=='game'||!(amt>0)||amt>g.cash){toast('KHÔNG ĐỦ TIỀN!','bad');return}
  lifeSpend(amt);lifeGain('family',Math.round(amt/1e5*2.4));addLog(`Gửi về quê: ${ff(amt)}`,'save');save();render();
}
// monthly: family worries when nothing is sent; content family sends food and a little money
function debtMonthEnd(){
  if(g.debt<=0)return;
  const add=Math.round(g.debt*g.debtRate);if(add>0){g.debt+=add;g.fin.loan=(g.fin.loan||0)+add;addLog('Lãi vay tháng này: +'+ff(add),'warn')}
  if(g.debt>=3e7){g.endWhy='debt'}
}
function familyMonthEnd(){
  lifeGain('family',-Math.round(6*hardM()));
  if(g.drink>=50){lifeGain('family',-4);addLog('Người nhà nghe tin bạn hay nhậu: -4 gia đình','warn')}

// ===== BLACKJACK (in the ĐỜI SỐNG hub) =====
// Standard rules: fresh shuffled 52-card deck every hand, dealer stands on all 17s, blackjack pays 3:2, double down on the
// first two cards, one split per hand (split aces get one card each). Pure chance and fair: nothing here looks at the
// player's luck, difficulty or habit meters. Each hand costs 10 s of the day and raises the gambling meter; max BJ_MAX hands a day.
const BJ_CHIPS=[5e4,1e5,2e5,5e5,1e6,2e6],BJ_TIME=10,BJ_HOOK=2,BJ_MIN=5e4;
let BJ=null;
function bjCap(){return Math.min(g.cash,Math.max(BJ_MIN,Math.floor(g.cash*.2)))}   // table limit: 20% of cash on hand
function bjCards(deck){const r=[];for(const s of[0,1,2,3])for(let k=1;k<=13;k++)r.push({k,s});for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function bjVal(cards){let t=0,a=0;cards.forEach(c=>{if(c.k===1){a++;t+=11}else t+=Math.min(10,c.k)});while(t>21&&a>0){t-=10;a--}return{t,soft:a>0&&t<=21}}
function bjNat(h){return h.cards.length===2&&!h.split&&bjVal(h.cards).t===21}
function bjDraw(){return BJ.deck.pop()}
function bjOpen(){
  if(!modal||modal.type!=='hub'||g.phase!=='game')return;
  BJ={phase:'bet',bet:Math.min(1e5,Math.max(BJ_MIN,bjCap())),chase:false,msg:''};modal={type:'bj'};render();
}
function bjLeave(){
  if(!BJ||BJ.phase==='play'||BJ.phase==='dealer')return;
  if(g.bjLoss>=3)g.bjLoss=0;   // walking away resets the streak
  BJ=null;modal={type:'hub'};save();render();
}
// The table limit follows the cash on hand, so after a loss the chosen bet can exceed it: drop to the biggest chip that fits.
function bjFixBet(){
  if(!BJ)return;const cap=bjCap();
  if(BJ.bet>cap||BJ.bet<BJ_MIN){const fit=BJ_CHIPS.filter(v=>v<=cap);BJ.bet=fit.length?fit[fit.length-1]:Math.max(BJ_MIN,Math.min(cap,BJ.bet))}
}
function bjBet(v){if(BJ&&(BJ.phase==='bet'||BJ.phase==='done')&&v>=BJ_MIN&&v<=bjCap()){BJ.bet=v;render()}}
function bjCanPlay(){return g.bjToday<BJ_MAX&&g.dayTimeLeft>BJ_TIME&&g.cash>=BJ_MIN}
function bjDeal(){
  if(!BJ||BJ.phase!=='bet'&&BJ.phase!=='done')return;
  if(!bjCanPlay()){return}
  bjFixBet();const bet=BJ.bet;if(bet<BJ_MIN||g.cash<bet)return;
  BJ.deck=bjCards();BJ.bet=bet;BJ.chase=BJ.chase||false;
  lifeSpend(bet);g.bjToday++;g.dayTimeLeft-=BJ_TIME;g.gamble=Math.min(100,g.gamble+BJ_HOOK);
  BJ.hands=[{cards:[bjDraw()],bet,done:false}];BJ.dealer=[bjDraw()];
  BJ.hands[0].cards.push(bjDraw());BJ.dealer.push(bjDraw());
  BJ.hi=0;BJ.phase='play';BJ.res=null;BJ.msg='';
  persistNow();   // the stake is gone even if the page is reloaded mid-hand
  const pn=bjNat(BJ.hands[0]),dn=bjVal(BJ.dealer).t===21;
  if(pn||dn){BJ.hands[0].done=true;bjSettle();return}
  render();
}
function bjHand(){return BJ.hands[BJ.hi]}
function bjCanDouble(){const h=bjHand();return BJ.phase==='play'&&h.cards.length===2&&!h.aceSplit&&g.cash>=h.bet}
function bjCanSplit(){const h=bjHand();return BJ.phase==='play'&&BJ.hands.length===1&&h.cards.length===2&&Math.min(10,h.cards[0].k)===Math.min(10,h.cards[1].k)&&g.cash>=h.bet}
function bjNext(){
  while(BJ.hi<BJ.hands.length&&BJ.hands[BJ.hi].done)BJ.hi++;
  if(BJ.hi>=BJ.hands.length){bjDealer();return}
  const h=bjHand();
  if(h.cards.length===1){h.cards.push(bjDraw());if(h.aceSplit||bjVal(h.cards).t>=21)h.done=true;return bjNext()}   // second hand of a split gets its card
  render();
}
function bjHit(){
  if(!BJ||BJ.phase!=='play')return;const h=bjHand();h.cards.push(bjDraw());
  const v=bjVal(h.cards).t;if(v>=21)h.done=true;
  bjNext();
}
function bjStand(){if(!BJ||BJ.phase!=='play')return;bjHand().done=true;bjNext()}
function bjDouble(){
  if(!BJ||!bjCanDouble())return;const h=bjHand();
  lifeSpend(h.bet);h.bet*=2;h.doubled=true;h.cards.push(bjDraw());h.done=true;persistNow();bjNext();
}
function bjSplit(){
  if(!BJ||!bjCanSplit())return;const h=bjHand();
  lifeSpend(h.bet);
  const c2=h.cards.pop(),ace=c2.k===1;
  h.split=true;h.aceSplit=ace;
  BJ.hands.push({cards:[c2],bet:h.bet,done:false,split:true,aceSplit:ace});
  h.cards.push(bjDraw());if(ace||bjVal(h.cards).t>=21)h.done=true;
  persistNow();bjNext();
}
function bjDealer(){
  BJ.phase='dealer';BJ.hi=-1;render();
  const live=BJ.hands.some(h=>bjVal(h.cards).t<=21&&!bjNat(h));
  const step=()=>{
    if(!BJ)return;
    if(live&&bjVal(BJ.dealer).t<17){BJ.dealer.push(bjDraw());render();after(550,step)}else bjSettle();
  };
  after(500,step);
}
function bjSettle(){
  const d=bjVal(BJ.dealer).t,dn=BJ.dealer.length===2&&d===21;
  let ret=0,staked=0;const lines=[];
  BJ.hands.forEach(h=>{
    const v=bjVal(h.cards).t;staked+=h.bet;let r=0,t;
    if(bjNat(h)){if(dn){r=h.bet;t='push'}else{r=h.bet+Math.floor(h.bet*1.5);t='bj'}}
    else if(v>21){t='bust'}
    else if(dn){t='lose'}
    else if(d>21||v>d){r=h.bet*2;t='win'}
    else if(v===d){r=h.bet;t='push'}
    else t='lose';
    h.out=t;h.ret=r;ret+=r;
  });
  if(ret>0){g.cash+=ret;g.fin.life=Math.max(0,(g.fin.life||0)-ret)}
  const net=ret-staked;g.bjNet+=net;
  if(net<0){g.bjLoss++;if(g.bjLoss>=4){lifeGain('family',-3);addLog('Thua liền mấy ván, bạn về nhà muộn và cáu: -3 gia đình','warn')}}
  else if(net>0)g.bjLoss=0;
  BJ.res={net,ret,staked};BJ.phase='done';BJ.hi=-1;
  if(net>0)burst(18,FX_COIN);
  addLog(`Blackjack: ${net>0?'thắng +'+ff(net):net<0?'thua '+ff(-net):'hòa'}`,net>0?'earn':net<0?'cost':'info');
  save();render();
}
function bjChase(){if(BJ&&BJ.phase==='done'){BJ.chase=true;render()}}
function bjLoan(){takeLoan('hot');if(BJ)render()}
